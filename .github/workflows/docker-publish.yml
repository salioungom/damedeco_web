name: Docker Image Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR exige un nom d'image en minuscules ; normalisé à l'étape dédiée ci-dessous.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Vérifier les URLs de production
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          API_URL="$NEXT_PUBLIC_API_URL"
          SITE_URL="$NEXT_PUBLIC_SITE_URL"
          if [ -z "$API_URL" ]; then
            echo "::error::La variable NEXT_PUBLIC_API_URL est vide ou non définie."
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error::La variable NEXT_PUBLIC_SITE_URL est vide ou non définie."
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *)
              echo "::error::NEXT_PUBLIC_API_URL doit commencer par https://."
              exit 1
              ;;
          esac
          case "$SITE_URL" in
            https://*) ;;
            *)
              echo "::error::NEXT_PUBLIC_SITE_URL doit commencer par https://."
              exit 1
              ;;
          esac
          case "$API_URL $SITE_URL" in
            *staging*|*localhost*)
              echo "::error::Les URLs de production ne doivent pas contenir staging ou localhost."
              exit 1
              ;;
          esac
          case "$API_URL" in
            https://api.damedeco.shop|https://api.damedeco.shop/) ;;
            *)
              echo "::error::NEXT_PUBLIC_API_URL doit pointer vers l'API de production."
              exit 1
              ;;
          esac
          case "$SITE_URL" in
            https://damedeco.shop|https://damedeco.shop/) ;;
            *)
              echo "::error::NEXT_PUBLIC_SITE_URL doit pointer vers le site de production."
              exit 1
              ;;
          esac

      - name: Normaliser le nom de l'image en minuscules
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Vérifier la disponibilité de l'API
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          API_URL="${API_URL%/}"
          curl -fsS --retry 3 --retry-delay 2 --max-time 10 "$API_URL/health/ready"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx (docker-container)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            API_URL_SERVER=${{ vars.API_URL_SERVER || vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
