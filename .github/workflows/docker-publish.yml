name: Docker Image Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR exige un nom d'image en minuscules ; normalisé à l'étape dédiée ci-dessous.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Vérifier NEXT_PUBLIC_API_URL
        env:
          NEXT_PUBLIC_API_URL: https://api-staging.damedeco.shop/
        run: |
          API_URL="$NEXT_PUBLIC_API_URL"
          if [ -z "$API_URL" ]; then
            echo "::error::La variable NEXT_PUBLIC_API_URL est vide ou non définie."
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *)
              echo "::error::NEXT_PUBLIC_API_URL doit commencer par https:// (valeur reçue : $API_URL)."
              exit 1
              ;;
          esac
          case "$API_URL" in
            *localhost*)
              echo "::error::NEXT_PUBLIC_API_URL ne doit pas contenir localhost pour une image de production."
              exit 1
              ;;
          esac
          echo "NEXT_PUBLIC_API_URL valide pour la production ($API_URL)."

      - name: Normaliser le nom de l'image en minuscules
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Vérifier la disponibilité de l'API
        env:
          API_URL: https://api-staging.damedeco.shop/
        run: |
          curl -fsS --retry 3 --retry-delay 2 --max-time 10 "$API_URL/health/ready"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-staging.damedeco.shop/
          cache-from: type=gha
          cache-to: type=gha,mode=max
