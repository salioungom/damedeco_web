version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # URL pour le SSR/ISR (côté serveur dans le conteneur)
      # host.docker.internal fonctionne sur Docker Desktop (Mac/Windows)
      # Sur Linux, utilisez l'IP de l'hôte ou ajoutez le backend au même réseau
      - API_URL_SERVER=http://host.docker.internal:8000
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
